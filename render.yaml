databases:
  - name: my-django-ap-db
    databaseName: resumes
    plan: free

services:
  - type: web
    name: my-django-ap
    runtime: docker
    plan: free
    branch: main
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: my-django-ap-db
          property: connectionString
    healthCheckPath: /